<!DOCTYPE html>
<html lang="pt-br">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login ♡</title>
 <link rel="stylesheet" href="style.css">
</head>

<body>

 <!-- FUNDO -->
 <div class="bolinhas">
   <span class="bolinha rosa"></span>
   <span class="bolinha azul"></span>
   <span class="bolinha roxa"></span>
   <span class="bolinha rosa"></span>
   <span class="bolinha azul"></span>
   <span class="bolinha roxa"></span>
   <span class="bolinha rosa"></span>
   <span class="bolinha azul"></span>
   <span class="bolinha roxa"></span>
   <span class="bolinha rosa"></span>
   <span class="bolinha azul"></span>
   <span class="bolinha roxa"></span>
 </div>

 <!-- LOGIN -->
 <div class="login-container">
   <div class="login-card">
     <div class="coracao">♡</div>
     <div class="logo">🔒</div>

     <div class="icone">
       <h1>Bem-vinda ♡</h1>
       <p>Acesse sua conta para continuar ♡</p>
     </div>

     <form id="login">
       <!-- E-MAIL -->
       <div class="input-grupo">
         <label for="email">E-mail</label>
         <div class="input-box">
           <span>💌</span>
           <input type="email" id="email" placeholder="Digite seu e-mail">
         </div>
       </div>

       <!-- SENHA -->
       <div class="input-grupo">
         <label for="senha">Senha</label>
         <div class="input-box">
           <span>🔑</span>
           <input type="password" id="senha" placeholder="Digite sua senha">
           <button type="button" id="togglepass" aria-label="Mostrar senha">👁️</button>
         </div>
       </div>

       <!-- ESQUECI -->
       <a href="#" class="esqueci" id="esqueci">Esqueci minha senha 😓</a>

       <!-- ENTRAR -->
       <button type="submit" class="btn-login">♡ Entrar ♡</button>

       <!-- MENSAGEM -->
       <div id="mensagem"></div>
     </form>

     <div class="decoracao">♡ 🩷 ♡</div>
   </div>
 </div>

 <script src="script.js"></script>

</body>

</html>
